; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; PlatformIO Project Configuration File

[env]
framework = arduino
; pioarduino build of Arduino-ESP32 3.3.12 (HomeSpan 2.x needs >= 3.3.0)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip

; --- ESP32-S3 board: pick the one that matches your module ---
; board = esp32-s3-devkitc-1
board = esp32-s3-devkitc-1

board_build.filesystem = littlefs

build_flags =
    ; Optional diagnostics instrumentation: FUTURE_DIAGNOSTICS
    ; Email delivery requires owner consent and per-coach relay configuration.
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I src
    -I src/Base
    -I src/Devices
    -I src/Devices/Controllable
    -I src/Devices/Controllable/Switches
    -I src/Devices/Controllable/HVAC
    -I src/Packets
    -I src/Devices/Sensors
    -I src/Devices/Sensors/Power
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

; NO miwagner, NO can_patch.py
lib_deps =
    elapsedMillis
    homespan/HomeSpan@2.1.8          ; was ^ ;@^1.9.1
    bblanchon/ArduinoJson@^7.2.0

upload_speed = 115200
monitor_speed = 115200
         ; Diagnostics are passive and available in all firmware environments.
monitor_filters =
    esp32_exception_decoder
    colorize
monitor_echo = yes
monitor_rts = 0
monitor_dtr = 0

[env:Release]
build_type = release

[env:Debug]
build_type = debug

[env:EmailBeta]
build_type = release
build_flags =
    ${env.build_flags}

[env:DiagnosticsBeta]
build_type = release
build_flags =
    ${env.build_flags}
    -D FUTURE_DIAGNOSTICS

; Optional dual-kit envs later:
; [env:homekit1]
; build_flags = ${env.build_flags} -D HOME_KIT_1
; [env:homekit2]
; build_flags = ${env.build_flags} -D HOME_KIT_2

